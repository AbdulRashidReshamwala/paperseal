[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
auto_detect_solc = false
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../spec/constants.json" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
