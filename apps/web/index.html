<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Seal</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f3ecdf" />
    <!-- The first paint, before any script. It matches LoadingSeal in packages/ui, which takes over from it. -->
    <style>
      :where(body) {
        margin: 0;
        background: #f3ecdf;
      }
      .ps-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .ps-boot-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .ps-boot-seal,
      .ps-boot-ring {
        grid-area: 1 / 1;
      }
      .ps-boot-seal {
        animation: ps-boot-press 460ms cubic-bezier(0.2, 0.8, 0.25, 1.1) 150ms both;
      }
      .ps-boot-ring {
        rotate: -90deg;
        fill: none;
        stroke: #96191f;
        stroke-width: 1;
        stroke-dasharray: 1 1;
        animation: ps-boot-ring 3s ease-in-out 610ms infinite both;
      }
      @keyframes ps-boot-press {
        from {
          opacity: 0;
          scale: 1.16;
        }
        70% {
          opacity: 1;
          scale: 0.98;
        }
      }
      @keyframes ps-boot-ring {
        from {
          stroke-dashoffset: 1;
        }
        50% {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -1;
        }
      }
      @keyframes ps-boot-appear {
        from {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ps-boot-seal,
        .ps-boot-ring {
          animation: ps-boot-appear 1ms 150ms both !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ps-boot" role="status">
        <span class="ps-boot-label">Loading</span>
        <img class="ps-boot-seal" src="./seal.svg" width="120" height="120" alt="" />
        <svg class="ps-boot-ring" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <circle cx="60" cy="60" r="50" pathLength="1" />
        </svg>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
